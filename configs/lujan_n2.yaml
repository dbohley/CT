# Lujan cos^{2n} model, n=2. Asymmetric breathing; expected K = 2.
name: lujan_n2
duration: 300.0
fs: 50.0
calib_seconds: 90.0
horizon: 0.25
seed: 0

source:
  name: lujan
  params:
    breaths_per_min: 15.0
    n: 2
    a: 10.0
    b: 0.0
    phi: 0.0
    noise_std: 0.15

identifier:
  name: fft_harmonic
  params:
    Kmax: 8
    energy_threshold: 0.95
    p0_inflation: 2.0

tracker:
  name: harmonic_ekf
  params:
    joseph: true
    wrap_phases: true
