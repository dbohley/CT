# Sanity-check case: the generator matches the estimator's model exactly, and
# the fundamental is stationary. If this run is not clean, nothing else means
# anything. Expect K=2, NIS ~ 1, tracking RMSE well below noise_std.
#
# For frequency tracking, see sinusoid_ramp.yaml.
name: sinusoid
duration: 300.0
fs: 50.0
calib_seconds: 90.0
horizon: 0.25
seed: 0

source:
  name: sinusoid
  params:
    breaths_per_min: 15.0
    amplitudes: [10.0, 3.0]
    phases: [0.0, 1.1]
    a0: 0.0
    noise_std: 0.15
    omega_ramp: 0.0

identifier:
  name: fft_harmonic
  params:
    Kmax: 8
    energy_threshold: 0.95
    p0_inflation: 2.0

tracker:
  name: harmonic_ekf
  params:
    joseph: true
    wrap_phases: true
