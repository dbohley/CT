# Run the estimator on a bench run's aligned.csv -- real sensor data from real hardware,
# rather than a synthetic trace.
#
# scripts/plot_approach_and_seat.py writes <run>/aligned.csv with columns
# time_s,sensor_mm,truth_mm over the standoff_hold window: what the tactile sensor read,
# and what the phantom was actually doing at the same instant. Point source.params.path at
# one and the whole Stage-1/Stage-2 pipeline runs on it:
#
#   ct-identify --config bench_aligned \
#     --set source.params.path=outputs/approach_and_seat/<ts>/aligned.csv
#
# Swap y_column to truth_mm to identify the phantom's own motion instead -- the upper bound
# on what any estimator could recover from this sensor, and the thing to score against.
#
# A separate config rather than `--config sinusoid --set source.name=csv` because that
# config's source.params carry sinusoid-only keys (breaths_per_min, amplitudes, ...) and
# --set can add keys but not remove them, so CSVSource rejects the lot.
#
# fs is left unset: CSVSource infers it from the timestamps, which is right here because the
# grid comes from the controller's own measured sample rate (~127Hz on the bench, not a
# round number) rather than from anything configured.
name: bench_aligned
duration: 300.0
fs: 127.0
# Q is estimated from breath-to-breath refits, so the calibration window is really measured
# in breaths, not seconds: 90s is ~18 breaths at 12bpm, matching what session 006 had on the
# OptiTrack recordings. That needs run_approach_and_seat.py --record-s 180 (its new default);
# a 60s hold only affords ~6 refits and Q comes out noisy.
calib_seconds: 90.0
# A FALLBACK, only used when this config is run by hand (ct-pipeline). plot_approach_and_seat
# overrides it with a horizon assembled from the run being plotted.
#
# It used to be 0.677 -- session 007's measurement, then frozen and reused for every later
# run. It does not transfer, for two reasons found in session 013:
#
#   1. Most of it was never sensor latency. The ToF is non-contact but shares the bus, the
#      tick loop and the motion, and it lags 0.014-0.100s where the tactile arm lags
#      0.279-0.566s. The difference is viscoelastic settling in the CONTACT.
#   2. That contact term is not constant. It tracks how hard the arm is seated (+0.63
#      correlation with seat depth), so one number cannot be right for two runs.
#
# 0.677 also included the phantom motor's own ~0.05s tracking lag: it came from the one run
# on disk with no measured_mm, so it was scored against commanded_mm.
#
# Forecasting by the WHOLE sensing lag is still the right thing -- it is what puts the
# estimate back on top of where the phantom is now -- but it has to be this run's lag. On
# run 20260902-160517 (real lag 0.279s), forecasting at 0.677s scores WORSE than not
# forecasting at all: 0.4135mm RMSE against 0.3095mm for reading the sensor late.
horizon: 0.30
seed: 0

source:
  name: csv
  params:
    path: outputs/approach_and_seat/latest/aligned.csv
    t_column: time_s
    y_column: sensor_mm

identifier:
  name: fft_harmonic
  params:
    Kmax: 8
    # The 95% rule is kept, and deliberately not used, so the report prints what it *would*
    # have picked next to what is used. On this data it says K=1; measured forecast RMSE at
    # h=0.677s is 0.0766mm at K=1, 0.0515mm at K=3, 0.0484mm at K=4. K=3 takes essentially
    # all of the gain -- K=4 buys another 6% for two more states to estimate, each drifting
    # under Q. The disagreement between rule and choice is a finding, not something to hide.
    energy_threshold: 0.95
    K_override: 3
    # Directly measured sensor noise: session 005 recorded the tactile arm stationary and
    # got std 0.0027mm, so R = 0.0027^2. This replaces Stage 1's residual-variance fallback
    # (0.00943mm^2 here), which is an upper bound containing model mismatch and drove NIS to
    # 0.090 against an expected 1.0.
    #
    # It is honestly a LOWER bound: that measurement was free-air with the arm unloaded, and
    # measure_sensor_noise.py's own docstring flags that pressing the arm into skin adds
    # off-axis wobble it cannot see. Measured effect on run 20260901-165415: NIS 0.090 ->
    # 0.245. Still under the expected 1.0, so R is *still* too large even at the free-air
    # value -- S is dominated by P, not by R, which says the remaining inconsistency is in Q
    # and the model rather than in the noise floor. Settling it properly needs a breath-hold
    # segment measured in contact (pause the phantom mid-hold, set breath_hold_window),
    # which would make this one line obsolete.
    R_override: 7.3e-6
    p0_inflation: 2.0
    # session 015 measured q_scale=0.5 fixing frequency lock on ONE run (20260903-171153).
    # session 016 then found a SECOND trial of the same profile broke lock at every q_scale
    # from 0.1-5.0, including this one -- q_scale alone does not generalize.
    #
    # session 018's real sweep (5 profiles x 2 valid trials each, 10 runs total, see
    # docs/sessions/018-2026-09-04-real-sweep-results.md) confirms it: q_scale=0.5 with no
    # omega_bounds locks only 2 of these 10 real runs. It is the PAIR with
    # tracker.params.omega_bounds_fraction below that is validated -- q_scale=0.5 +
    # omega_bounds_fraction=0.1 is the only setting tested that keeps lock on all 10
    # (mean forecast RMSE 0.293mm). Do not trust q_scale in isolation again.
    q_scale: 0.5

tracker:
  name: harmonic_ekf
  params:
    joseph: true
    wrap_phases: true
    # Resolved at runtime to an absolute omega_bounds = bpm_to_omega(stage1_rate) * (1+-0.1)
    # (see ct.run.resolve_tracker_params) -- a fixed rad/s range can't generalize across the
    # 10-22bpm spread of real subjects this was tested on, only a bound relative to THIS run's
    # own Stage-1 rate can. Validated in the same 10-run sweep as q_scale above: this is the
    # one setting, of q_scale x omega_bounds combinations tested, that kept frequency lock on
    # every run.
    omega_bounds_fraction: 0.1
